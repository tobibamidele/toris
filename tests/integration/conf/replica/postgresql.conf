# postgresql.conf for integration test replica
# Identical to primary except hot_standby is explicitly on.

listen_addresses = '*'
port = 5432

# WAL / replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on

# Primary connection info (used after pg_basebackup seed)
primary_conninfo = 'host=toris-pg-primary port=5432 user=postgres password=postgres_pass application_name=replica'

# Test-friendly durability
fsync = off
synchronous_commit = off
full_page_writes = off

# Connections
max_connections = 50

# Logging
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '[%p] %t '
log_min_messages = warning

# postgresql.conf for integration test primary
# Tuned for test speed, not production durability.

listen_addresses = '*'
port = 5432

# WAL / replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 64MB
hot_standby = on

# Test-friendly durability (NOT for production)
fsync = off
synchronous_commit = off
full_page_writes = off

# Connections
max_connections = 50

# Logging
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '[%p] %t '
log_min_messages = warning

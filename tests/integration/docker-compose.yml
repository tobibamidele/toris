version: "3.9"

# toris integration test cluster
# Spins up: pg-primary, pg-replica-1, pg-replica-2, pg-control
#
# Usage:
#   docker compose up -d
#   go test ./tests/integration/... -tags integration -timeout 300s
#   docker compose down -v

networks:
  toris-test:
    driver: bridge

volumes:
  pg-primary-data:
  pg-replica-1-data:
  pg-replica-2-data:
  pg-control-data:

services:

  # ── Control database ────────────────────────────────────────────────────────
  # Separate from the managed cluster. toris stores leases, audit events,
  # backup records, and node registry here.
  pg-control:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: toris-pg-control
    environment:
      POSTGRES_USER: toris
      POSTGRES_PASSWORD: toris_control_pass
      POSTGRES_DB: toris_control
    ports:
      - "5440:5432"
    networks:
      - toris-test
    volumes:
      - pg-control-data:/var/lib/postgresql/data
      - ./initdb/control:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toris -d toris_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Primary node ─────────────────────────────────────────────────────────
  pg-primary:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: toris-pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: testdb
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5441:5432"
    networks:
      - toris-test
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./initdb/primary:/docker-entrypoint-initdb.d
      - ./conf/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      pg-control:
        condition: service_healthy

  # ── Replica 1 ───────────────────────────────────────────────────────────
  pg-replica-1:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: toris-pg-replica-1
    entrypoint: /usr/local/bin/replica-bootstrap.sh
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5442:5432"
    networks:
      - toris-test
    volumes:
      - pg-replica-1-data:/var/lib/postgresql/data
      - ./initdb/replica-bootstrap.sh:/usr/local/bin/replica-bootstrap.sh:ro
      - ./conf/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      pg-primary:
        condition: service_healthy

  # ── Replica 2 ───────────────────────────────────────────────────────────
  pg-replica-2:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: toris-pg-replica-2
    entrypoint: /usr/local/bin/replica-bootstrap.sh
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5443:5432"
    networks:
      - toris-test
    volumes:
      - pg-replica-2-data:/var/lib/postgresql/data
      - ./initdb/replica-bootstrap.sh:/usr/local/bin/replica-bootstrap.sh:ro
      - ./conf/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      pg-primary:
        condition: service_healthy
